<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{code}} — {{reason}}</title>
    <style>
/* Estilo de la página del tema `minimal`.
 *
 * Vive dentro de la página: un tema es una página, así que estas reglas no se
 * cargan de ningún fichero ni se incrustan al servir, y la página no puede pedir
 * nada por la red —nada de hojas importadas ni de ficheros remotos—. Si animase,
 * tendría que neutralizarlo en `prefers-reduced-motion: reduce`.
 *
 * Solo tipografía: ni un color de acento. La jerarquía la marcan el tamaño y el
 * peso, y el paso de claro a oscuro lo decide el sistema operativo. El marcado
 * lleva la clase `c<código>` en el `body`, pero este tema no la usa.
 *
 * Contraste medido a mano (objetivo AA): fg/bg 15,80 y muted/bg 6,11 en claro;
 * 16,02 y 6,50 en oscuro.
 *
 * El `<hr>` decorativo —un separador, no información— se queda fuera del 3:1
 * de WCAG 1.4.11, que cubre el contenido no textual necesario para entender el
 * contenido y los componentes de interfaz. Su `--rule` mide 1,43 sobre el fondo
 * claro y 1,55 sobre el oscuro: es una decisión medida, no un descuido, así que
 * quien vuelva a medirla no debería contarla como hallazgo.
 */

:root {
  color-scheme: light dark;
  --fg: #1f2328;
  --bg: #ffffff;
  --muted: #59636e;
  --rule: #d1d9e0;
}

@media (prefers-color-scheme: dark) {
  :root {
    --fg: #e6edf3;
    --bg: #0d1117;
    --muted: #9198a1;
    --rule: #30363d;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0 auto;
  padding: 2rem;
  max-width: 40rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.75rem;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.6;
  color: var(--fg);
  background: var(--bg);
}

h1 {
  margin: 0;
  font-size: clamp(2.5rem, 9vw, 4.5rem);
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

h2 {
  margin: 0;
  font-size: clamp(1.05rem, 2.5vw, 1.35rem);
  font-weight: 500;
  color: var(--muted);
}

hr {
  width: 6rem;
  margin: 0.5rem 0;
  border: 0;
  border-top: 1px solid var(--rule);
}

p {
  margin: 0;
  max-width: 40rem;
  color: var(--muted);
  line-height: 1.6;
}

/* La firma, en el tono atenuado: más pequeña, para no ganar peso a la
 * descripción. */
footer {
  margin-top: 1rem;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  color: var(--muted);
}
    </style>
  </head>
  <body class="c{{code}}">
    <main>
      <h1>{{code}}</h1>
      <h2>{{reason}}</h2>
      <hr />
      <p>{{description}}</p>
    </main>
    <footer>errserve</footer>
  </body>
</html>
