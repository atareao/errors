<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{code}} — {{reason}}</title>
    <style>
/* Estilo de la página del tema `amber`.
 *
 * Vive dentro de la página: un tema es una página, así que estas reglas no se
 * cargan de ningún fichero ni se incrustan al servir, y la página no puede pedir
 * nada por la red —nada de hojas importadas ni de ficheros remotos—. Si animase,
 * tendría que neutralizarlo en `prefers-reduced-motion: reduce`.
 *
 * Monocromo ámbar, como la pantalla de un CRT viejo, pero sin brillos ni
 * rastro: todos los elementos en tonos de ámbar. El marcado lleva la clase
 * `c<código>` en el `body`, pero este tema no la usa.
 *
 * Contraste medido a mano (objetivo AA): fg/bg 10,37, accent/bg 13,02 y muted/bg
 * 5,38.
 *
 * El `<hr>` decorativo —un separador, no información— se queda fuera del 3:1
 * de WCAG 1.4.11, que cubre el contenido no textual necesario para entender el
 * contenido y los componentes de interfaz. Su `--rule` mide 1,48 sobre el fondo
 * `#12100c`: es una decisión medida, no un descuido, así que quien vuelva a
 * medirla no debería contarla como hallazgo.
 */

:root {
  color-scheme: dark;
  --bg: #12100c;
  --fg: #ffb000;
  --accent: #ffcf6b;
  --muted: #9a8836;
  --rule: #3a3120;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0 auto;
  padding: 2rem;
  max-width: 46rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.5rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono",
    monospace;
  line-height: 1.5;
  color: var(--fg);
  background: var(--bg);
}

h1 {
  margin: 0;
  font-size: clamp(2.75rem, 10vw, 5rem);
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent);
}

h2 {
  margin: 0;
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  font-weight: 600;
  color: var(--fg);
}

hr {
  width: 100%;
  margin: 0.75rem 0;
  border: 0;
  border-top: 1px solid var(--rule);
}

p {
  margin: 0;
  max-width: 46rem;
  color: var(--muted);
}

/* La firma, en el ámbar atenuado: sin brillos, como el resto del tema. */
footer {
  margin-top: 0.75rem;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  color: var(--muted);
}
    </style>
  </head>
  <body class="c{{code}}">
    <main>
      <h1>{{code}}</h1>
      <h2>{{reason}}</h2>
      <hr />
      <p>{{description}}</p>
    </main>
    <footer>errserve</footer>
  </body>
</html>
