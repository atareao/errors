<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{code}} — {{reason}}</title>
    <style>
/* Estilo de la página del tema `paper`.
 *
 * Vive dentro de la página: un tema es una página, así que estas reglas no se
 * cargan de ningún fichero ni se incrustan al servir, y la página no puede pedir
 * nada por la red —nada de hojas importadas ni de ficheros remotos—. Si animase,
 * tendría que neutralizarlo en `prefers-reduced-motion: reduce`.
 *
 * Serif y fondo crema: el aire de un documento impreso. Márgenes generosos y
 * una regla discreta. El marcado lleva la clase `c<código>` en el `body`, pero
 * este tema no la usa.
 *
 * Contraste medido a mano (objetivo AA): fg/bg 14,01, accent/bg 6,85 y muted/bg
 * 5,62.
 *
 * El `<hr>` decorativo —un separador, no información— se queda fuera del 3:1
 * de WCAG 1.4.11, que cubre el contenido no textual necesario para entender el
 * contenido y los componentes de interfaz. Su `--rule` mide 1,39 sobre el fondo
 * `#faf7f0`: es una decisión medida, no un descuido, así que quien vuelva a
 * medirla no debería contarla como hallazgo.
 */

:root {
  color-scheme: light;
  --bg: #faf7f0;
  --fg: #2b2620;
  --muted: #6b6252;
  --accent: #7a4b2a;
  --rule: #ddd3c0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0 auto;
  padding: 4rem 2rem;
  max-width: 38rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.75rem;
  font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  line-height: 1.6;
  color: var(--fg);
  background: var(--bg);
}

h1 {
  margin: 0;
  font-size: clamp(2.75rem, 10vw, 5rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--accent);
}

h2 {
  margin: 0;
  font-size: clamp(1.1rem, 3vw, 1.4rem);
  font-weight: 400;
  font-style: italic;
  color: var(--muted);
}

hr {
  width: 5rem;
  margin: 1.25rem 0;
  border: 0;
  border-top: 1px solid var(--rule);
}

p {
  margin: 0;
  max-width: 38rem;
  color: var(--muted);
}

/* La firma: una línea discreta en cursiva, en el tono de la tinta atenuada. */
footer {
  margin-top: 1.25rem;
  font-size: 0.85rem;
  font-style: italic;
  color: var(--muted);
}
    </style>
  </head>
  <body class="c{{code}}">
    <main>
      <h1>{{code}}</h1>
      <h2>{{reason}}</h2>
      <hr />
      <p>{{description}}</p>
    </main>
    <footer>errserve</footer>
  </body>
</html>
