# Backend de demostración: devuelve un código de error real sin necesitar
# ficheros ni upstream que falle. `return` corta en la fase de rewrite.
server {
    listen 80;
    server_name _;

    location = /boom { return 503 "backend caido"; }
    location = /gone { return 410 "se fue"; }
    location /      { return 404 "no existe"; }
}
