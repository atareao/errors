<!doctype html>
<!-- Fixture del operador: una pagina propia y ya autocontenida, **sin ningun**
     marcador de plantilla (nada entre llaves) ni de hoja (ninguna etiqueta de
     enlace). El render tiene que servirla byte a byte, sin tocar un solo byte:
     ni rellenar ni incrustar estilos. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fixture sin marcadores</title>
  </head>
  <body>
    <h1>pagina propia del operador</h1>
    <p>Este cuerpo es distintivo y no lleva ningun marcador de plantilla.</p>
  </body>
</html>
