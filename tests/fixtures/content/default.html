<!doctype html>
<!-- Fixture del operador: su propia plantilla en `CONTENT_DIR`. Lleva los tres
     marcadores de plantilla, así que el render la rellena al servir y un código
     sin fichero propio recibe **su** cuerpo, no el de otro. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{code}} — {{reason}}</title>
  </head>
  <body class="c{{code}}">
    <h1>{{code}}</h1>
    <h2>{{reason}}</h2>
    <p>{{description}}</p>
  </body>
</html>
