<!doctype html>
<!-- Fixture del change `self-contained-themes`: una página que lleva **el
     marcador** `<link rel="stylesheet" href="/css/error.css" />` y **además**
     un `<link>` ajeno. Sirve para fijar que al servir solo el marcador se
     sustituye por el bloque `<style>` y que el enlace ajeno se deja en paz.

     No lleva un `css/error.css` propio a propósito: su ausencia es deliberada,
     porque la hoja del marcador se resuelve desde la copia embebida del
     binario. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>404 — Not Found (con marcador)</title>
    <link rel="stylesheet" href="/css/error.css" />
    <link rel="stylesheet" href="/css/otra.css" />
  </head>
  <body class="c404">
    <h1>404</h1>
    <p>Not Found (fixture con marcador)</p>
  </body>
</html>
