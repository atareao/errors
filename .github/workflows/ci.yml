name: CI

on:
  push:
    branches: [main, development]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  puertas:
    name: fmt, clippy y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # El crate usa edition 2024, que exige rustc >= 1.85; `stable` lo cumple.
      - name: Instalar el toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      # Las mismas tres puertas que se ejecutan a mano antes de commitear.
      - name: Formato
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # La lección de `fix-image-build`, ahora sobre el crate: el empaquetado no puede descubrirse
      # por primera vez al publicar, y menos a mano. `--dry-run` empaqueta, compila el paquete y
      # valida sus metadatos SIN subir nada (lo dice cargo: «aborting upload due to dry run»), así
      # que cabe aquí, en el job que ya tiene toolchain y caché. Y no es teórico: `content/` viaja
      # dentro del `.crate` —las siete páginas, medido: 7 de los 40 ficheros del paquete—,
      # y eso es lo único que hace que el binario instalado sirva las páginas de verdad; hasta hoy
      # solo lo comprobaba una medición a mano. No hace falta un check requerido nuevo: va dentro de
      # `puertas`, que ya lo es.
      - name: Paquete publicable
        run: cargo publish --dry-run --locked

  # Puerta de dependencias. Va aparte de las tres anteriores —y no dentro del
  # mismo job— porque no necesita compilar nada: si el `Cargo.lock` trae un aviso
  # de seguridad, una licencia incompatible o una fuente inesperada, esto se ve
  # en un minuto mientras el job de arriba sigue compilando. El `name` de un job
  # es lo que se marca como «check» requerido en la protección de rama.
  dependencias:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Binario precompilado: `cargo install cargo-deny` se pasa varios minutos
      # compilando el propio cargo-deny en cada ejecución.
      #
      # La versión va fijada a la **misma que se verificó al escribir
      # `deny.toml`** (aquí, 0.20.2): el formato del fichero de configuración ha
      # cambiado entre versiones —campos que se eliminan y pasan a ser error—,
      # así que un `cargo-deny` nuevo no debería poder romper el CI sin que haya
      # un commit de por medio. Subirla es cambiar esta línea y volver a pasar
      # `cargo deny check -D warnings` en local.
      - name: Instalar cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # Las cuatro comprobaciones de una vez: avisos (RustSec), licencias,
      # prohibiciones y duplicaciones, y fuentes del `Cargo.lock`.
      #
      # `-D warnings` convierte en error los avisos de higiene del propio
      # `deny.toml` —una licencia permitida que ya no usa nadie, por ejemplo—:
      # sin él se quedan en el log y el fichero deriva a permitir de más.
      - name: Avisos, licencias, duplicaciones y fuentes
        run: cargo deny check -D warnings

  # Puerta del empaquetado. Faltaba, y su ausencia salió cara: hasta hoy la única
  # forma de construir la imagen era el workflow de release, que se dispara al
  # etiquetar, así que un `Dockerfile` que dejara de compilar solo se descubría
  # publicando —pasó con la etiqueta `v0.4.0`: `exit code 101` y ningún artefacto—.
  # Va aparte de las tres puertas porque no necesita Rust ni el árbol de
  # dependencias de Cargo: solo el docker del runner. El `name` del job es lo que
  # se marca como «check» requerido en la protección de rama.
  imagen:
    name: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Sin caché a propósito: lo que se comprueba es que la imagen se construye
      # **desde el árbol**, en frío, como en un host cualquiera. Una caché de
      # capas taparía justo el fallo que esta puerta viene a cazar —un `COPY` que
      # falta y que una capa ya construida esquiva—.
      - name: Construir la imagen
        run: docker build --tag errserve:ci .

      # Construir no es probar: una imagen que compila y no responde el contrato del
      # servicio tiene que poner esta puerta en rojo. El `docker` del runner es el
      # motor real, así que no hace falta pasar `ENGINE`.
      - name: Probar la imagen (smoke test)
        env:
          IMAGE: errserve:ci
        run: bash .github/scripts/smoke.sh
